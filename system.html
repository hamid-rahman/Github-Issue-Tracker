<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github-Issue-Tracker</title>
    <link rel="stylesheet" href="./assets/file/style.css">

    <!-- DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />

      <!-- font-awesome cdn link -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

  <!-- tailwind and daisyui cdn link -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    
<header class="">
  <div class=" bg-base-200 lg:mb-48 shadow-sm w-full rounded-md">
  <input id="navbar-1-toggle" class="peer hidden" type="checkbox" />
  <label for="navbar-1-toggle" class="fixed inset-0 hidden max-lg:peer-checked:block"></label>
  <div class=" navbar">
    <div class="navbar-start">
      <img class="h-10 w-10" src="./assets/images/github-logo.png" alt="">
      <span class="text-lg font-bold ml-2">Github Issue Tracker</span>
    </div>

    <div class="navbar-end">
      <input id="input-search" type="text" placeholder="Search" class="input w-64 lg:w-auto" />
      <button id="btn-search" class="btn btn-primary ml-2"><i class="fa-solid fa-search"></i>Searach</button>
    </div>
  </div>
</div>
</header>


<!-- nevigate -->
<section class="w-11/12 mx-auto bg-blue-50 rounded-md shadow-sm p-4 mt-4 flex gap-2">
  <button id="all-btn" class="btn active">All</button>
  <button id="open-btn" class="btn">Open</button>
  <button id="closed-btn" class="btn">Closed</button>
  
</section>


<!-- status -->

  <section class="rounded-md bg-base-100 shadow-sm w-11/12 mx-auto">

    <!-- header -->
    <div class="mt-10 flex flex-col md:flex-row gap-3 items-center justify-between p-5 border-b border-gray-200">
      
      <div class="flex items-center gap-3">
        <div class="bg-indigo-100 text-indigo-600 rounded-full w-10 h-10 flex items-center justify-center">
          <i class="fa-solid fa-bug"></i>
        </div>
        <div>
          <div id="total-issues-count" class="text-xl font-bold"></div>
          <p class="text-gray-500 text-sm">Track and manage your project issues</p>
        </div>
      </div>

      <div id="status-legend" class="flex gap-5 font-medium">
        <!-- <p class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-green-500"></span> Open</p> -->
        <!-- <p class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-purple-500"></span> Closed</p> -->
      </div>
    </div>



<!-- Display all issues from the API -->
    <div id="display-all-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5 p-5 bg-gray-50">
     
    </div>

      <div id="spinner" class=" flex items-center justify-center hidden">
      <span class="loading loading-bars loading-lg"></span>
    </div>


          <!-- You can open the modal using ID.showModal() method -->
<!-- <button class="btn" onclick="my_modal_3.showModal()">open modal</button> -->
<dialog id="my_modal_3" class="modal">
  <div class="modal-box">

    <div id="display-details" class="pb-8">
      
    </div>

    <form method="dialog">
    <button class="btn btn-primary absolute right-4 bottom-4">Close</button>
    </form>

  </div>
</dialog>

  </section>










<script src="./assets/file/script.js"></script>
</body>
</html>
