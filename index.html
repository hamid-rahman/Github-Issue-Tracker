<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./assets/file/style.css">

    <!-- DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />

      <!-- font-awesome cdn link -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

  <!-- tailwind and daisyui cdn link -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    
<section class="w-11/12 min-h-screen mx-auto flex items-center justify-center">

<fieldset class="fieldset bg-base-200 border-base-300 rounded-box w-xs border p-4">
  <div class="top flex flex-col justify-center items-center">
    <img class="w-15 text-center" src="./assets/images/github-logo.png" alt="">
    <h2 class="text-xl font-bold text-center">GitHub Issues Tracker</h2>
    <p class="pb-5">Sign in to manage your issues</p>
  </div>

  <label class="label">Username</label>
  <input id="username" type="text" class="input" placeholder="Enter Username" />

  <label class="label">Password</label>
  <input id="password" type="password" class="input" placeholder="Enter Password" />

  <button id="login" class="btn btn-neutral mt-4">Login</button>
</fieldset>
</section>








<script src="./assets/file/login.js"></script>
</body>
</html>
